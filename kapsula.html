
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kapsuła czasu — Brydż w Koninie</title>
<link rel="icon" href="assets/branding/favicon.ico"><link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png">
<style>
:root {
  --navy:#193a50;
  --green:#237552;
  --bg:#f4f6f7;
}
* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:#263844;
  line-height:1.6;
}
header {
  background:var(--navy);
  color:white;
  padding:20px 5%;
}
.brand {
  font-size:26px;
  font-weight:bold;
}
.portal-header {display:flex;align-items:center;gap:20px}
.portal-home {flex:none}
.portal-logo {width:240px;height:auto;display:block}
nav {
  display:flex;
  gap:25px;
  flex-wrap:wrap;
  margin-top:12px;
}
nav a {color:white;text-decoration:none}
nav a:hover {text-decoration:underline}
.hero {
  background:linear-gradient(120deg,#193a50,#237552);
  color:white;
  padding:65px 20px;
  text-align:center;
}
.hero h1 {
  font-size:clamp(30px,5vw,46px);
  margin:0 0 12px;
}
main {
  max-width:1150px;
  margin:auto;
  padding:30px 20px;
}
h2 {color:var(--navy)}
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
  margin:25px 0 40px;
}
.card,.panel {
  background:white;
  border-radius:12px;
  padding:25px;
  box-shadow:0 3px 12px #0000000b;
}
.card {border-top:4px solid var(--green)}
.card h3 {margin-top:0;color:var(--navy)}
.panel {margin:30px 0}
.button {
  display:inline-block;
  background:var(--green);
  color:white;
  padding:10px 18px;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
}
.archive-window {
  border:1px solid #ccd5da;
  border-radius:10px;
  overflow:hidden;
  margin-top:20px;
}
.window-bar {
  background:#e6ecef;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.window-bar strong {font-size:14px}
.window-bar a {
  color:var(--navy);
  font-size:14px;
}
.archive-window iframe {
  width:100%;
  height:650px;
  border:0;
  display:block;
  background:white;
}
footer {
  background:var(--navy);
  color:white;
  text-align:center;
  padding:25px;
}
@media(max-width:650px) {
  header {padding:18px}
  .portal-header {display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px}
  .portal-logo {width:105px}
  .brand {font-size:20px}
  nav {gap:12px}
  .hero {padding:45px 15px}
  .archive-window iframe {height:500px}
  .panel {padding:18px}
}
</style>
</head>

<body>
<header>
  <div class="portal-header">
    <a class="portal-home" href="https://g115-obs.github.io/ktb-konin/"><img class="portal-logo" src="assets/branding/logo.webp" width="240" height="160" alt="Brydż w Koninie – strona główna"></a>
    <div><div class="brand">Brydż w Koninie</div>
    <nav>
      <a href="index.html#start">Start</a>
      <a href="https://g115-obs.github.io/wyniki-brydzowe/">Wyniki</a>
      <a href="https://g115-obs.github.io/doubledummy/">Analizator rozdań</a>
      <a href="kapsula.html" aria-current="page">Kapsuła czasu</a>
    </nav></div>
  </div>
</header>
<main>
  <h1>Kapsuła czasu</h1>
  <div class="archive-window">
    <div class="window-bar">
      <strong>Archiwalna witryna KTB</strong>
      <a href="archiwum/index.htm"
         target="_blank"
         rel="noopener">
        Otwórz w pełnym oknie ↗
      </a>
    </div>

    <iframe
      src="archiwum/index.htm"
      title="Historyczna strona KTB Konin"
      loading="lazy">
    </iframe>
  </div>
</main>
</body>
</html>
